[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kaos-lib"
version = "0.3.0"
description = "KAOS platform library: datasets (formats, versions), run outputs and the kaos-cli command over kaos-lake. Formerly kubecore."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6,<7",
    "packaging>=21",
]

[project.urls]
Homepage = "https://github.com/kaos-io/kaos-lib"
Source = "https://github.com/kaos-io/kaos-lib"
Issues = "https://github.com/kaos-io/kaos-lib/issues"
Changelog = "https://github.com/kaos-io/kaos-lib/blob/main/CHANGELOG.md"

[project.optional-dependencies]
zitadel = ["PyJWT>=2.8", "cryptography>=41"]   # machine-key tokens for datasets shared by other projects
test = ["pytest>=7", "PyJWT>=2.8", "cryptography>=41"]

[project.scripts]
kaos-cli = "kaos_lib.cli:main"
kubecore = "kaos_lib.cli:kubecore_alias"   # deprecated alias, removed in the next release

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kaos_lib = ["_release.json", "layouts/shared/*.json", "layouts/shared/builtin/*/layout.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
