[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kaos-lib"
version = "0.5.0"
description = "KAOS platform library: pipeline steps, datasets (layouts, versions), run outputs, MLflow, the ledger and the kaosctl command over kaos-lake."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "tomli>=2; python_version < '3.11'",
    "requests>=2.31",
    "PyYAML>=6,<7",
    "packaging>=21",
]

[project.urls]
Homepage = "https://github.com/kaos-io/kaos-lib"
Source = "https://github.com/kaos-io/kaos-lib"
Issues = "https://github.com/kaos-io/kaos-lib/issues"
Changelog = "https://github.com/kaos-io/kaos-lib/blob/main/CHANGELOG.md"

[project.optional-dependencies]
zitadel = ["PyJWT>=2.8", "cryptography>=41"]   # machine-key tokens for datasets shared by other projects
mlflow = ["mlflow-skinny>=3,<4", "PyJWT>=2.8", "cryptography>=41"]   # kaos_lib.mlflow, kaos_lib.lock.write/load, run --lock
test = ["pytest>=7", "PyJWT>=2.8", "cryptography>=41", "mlflow-skinny>=3,<4"]

[project.scripts]
kaosctl = "kaos_lib.cli:main"

[project.entry-points."mlflow.request_auth_provider"]
zitadel = "kaos_lib.mlflow:ZitadelRequestAuthProvider"   # MLFLOW_TRACKING_AUTH=zitadel

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kaos_lib = ["_release.json", "layouts/shared/*.json", "layouts/shared/builtin/*/layout.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
