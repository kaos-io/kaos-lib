site_name: kaos-lib
site_description: The KAOS platform library and the kaosctl command — datasets, run outputs, MLflow, the run context and the data lock
site_author: Novelcore
site_url: https://storage.googleapis.com/kaos-dev-511509-kaos-lib/docs/
# A plain public bucket, no web server: every link names its .html file (https://storage.googleapis.com/kaos-dev-511509-kaos-lib/docs/index.html).
use_directory_urls: false

repo_name: kaos-io/kaos-lib
repo_url: https://github.com/kaos-io/kaos-lib
edit_uri: edit/main/docs/

docs_dir: docs

validation:   # --strict then fails on a broken link or anchor
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
exclude_docs: |
  __pycache__/
  hooks.py
  requirements.txt
  generated/built.md
  generated/install.md
  design/
  examples/
hooks:
  - docs/hooks.py
  - docs_check.py   # words, removed names, links: a finding fails the build

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 2
            members_order: source
            docstring_style: google
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs, "."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Start here:
      - 1. Run it: run-it.md
      - 2. Your first step: first-step.md
      - 3. Settings: settings.md
      - 4. Read data: read-data.md
      - 5. Pass things on: pass-things-on.md
      - 6. Produce a dataset: produce-a-dataset.md
      - 7. Bigger machines: bigger-machines.md
