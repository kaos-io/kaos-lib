site_name: kaos-lib
site_description: The KAOS platform library and the kaosctl command — datasets, run outputs, MLflow, the run context and the data lock
site_author: Novelcore
site_url: https://storage.googleapis.com/kaos-dev-511509-kaos-lib/docs/
# A plain public bucket, no web server: every link names its .html file (https://storage.googleapis.com/kaos-dev-511509-kaos-lib/docs/index.html).
use_directory_urls: false

repo_name: kaos-io/kaos-lib
repo_url: https://github.com/kaos-io/kaos-lib
edit_uri: edit/main/docs/

docs_dir: docs

validation:   # --strict then fails on a broken link or anchor
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
exclude_docs: |
  __pycache__/
  hooks.py
  requirements.txt
  generated/built.md
  generated/install.md
hooks:
  - docs/hooks.py

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 2
            members_order: source
            docstring_style: google
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [docs, "."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Guides:
      - Datasets: datasets.md
      - Outputs: outputs.md
      - Long runs on HPC (Slurm): checkpoint.md
      - Check your pipeline: lint.md
      - Set up your steps (kaosctl dev): dev.md
      - Run a step locally: step-run.md
      - Render your pipeline locally: render.md
      - Build a step image: build.md
      - MLflow: mlflow.md
      - Data lock: data-lock.md
      - Datasets shared with your project: shared-datasets.md
      - Make your own dataset layout: make-your-own-layout.md
  - Lint checks:
      - L-E00: lint/L-E00.md
      - L-E01: lint/L-E01.md
      - L-E02: lint/L-E02.md
      - L-E03: lint/L-E03.md
      - L-E04: lint/L-E04.md
      - L-E05: lint/L-E05.md
      - L-E06: lint/L-E06.md
      - L-W01: lint/L-W01.md
      - L-W02: lint/L-W02.md
      - L-W03: lint/L-W03.md
      - L-W04: lint/L-W04.md
      - L-W05: lint/L-W05.md
      - L-I01: lint/L-I01.md
      - L-I02: lint/L-I02.md
      - L-I03: lint/L-I03.md
      - L-D01: lint/L-D01.md
      - L-D02: lint/L-D02.md
      - L-D03: lint/L-D03.md
      - L-D04: lint/L-D04.md
      - L-D05: lint/L-D05.md
      - L-D06: lint/L-D06.md
      - L-D07: lint/L-D07.md
      - L-D08: lint/L-D08.md
  - Reference:
      - CLI: generated/cli.md
      - Python API: api.md
      - Run context: runtime.md
      - Progress of a step: progress.md
      - Credentials: credentials.md
      - Support policy and upgrades: support-window.md
      - Troubleshooting: troubleshooting.md
      - Troubleshooting dev, run, build: troubleshooting-build.md
      - Formerly kubecore: formerly-kubecore.md
      - Develop: develop.md
  - Changelog: changelog.md
